name: Security audit

on:
  pull_request:
    branches: [hmg]
  push:
    branches: [hmg]
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Block high/critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
