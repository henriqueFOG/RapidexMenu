name: RapidexMenu Variants E2E

on:
  push:
    branches: [agent/checklist-p0-wave-2]
  pull_request:
    branches: [hmg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidex-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidex
          POSTGRES_DB: rapidex_hmg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rapidex -d rapidex_hmg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      RAPIDEX_RUNTIME: vercel
      RAPIDEX_ENV: hmg
      RAPIDEX_PUBLIC_URL: http://localhost:3000
      RAPIDEX_AUTH_MODE: native
      RAPIDEX_SIGNUP_ENABLED: "true"
      RAPIDEX_SESSION_SECRET: hmg-ci-session-secret-32-characters-minimum-only
      RAPIDEX_INTEGRATION_SECRET: hmg-ci-integration-secret-32-characters-minimum
      CRON_SECRET: hmg-ci-cron-secret-32-characters-minimum-only
      DATABASE_URL: postgresql://rapidex@127.0.0.1:5432/rapidex_hmg?sslmode=disable
      RAPIDEX_POSTGRES_WS_PROXY: 127.0.0.1:9876
      RAPIDEX_E2E_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Start disposable PostgreSQL proxy
        run: |
          nohup node scripts/hmg-wsproxy.mjs > /tmp/rapidex-variants-wsproxy.log 2>&1 &
          for attempt in $(seq 1 20); do
            if grep -q "ws://127.0.0.1:9876" /tmp/rapidex-variants-wsproxy.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rapidex-variants-wsproxy.log || true
          exit 1

      - name: Build and migrate
        run: npm run build:vercel

      - name: Start application
        run: |
          nohup npx --no-install next start -H 127.0.0.1 -p 3000 > /tmp/rapidex-variants.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rapidex-variants.log || true
          exit 1

      - name: Seed and validate commercial baseline
        run: node scripts/hmg-e2e.mjs

      - name: Validate product variants
        run: node scripts/variant-e2e.mjs

      - name: Runtime log on failure
        if: failure()
        run: |
          cat /tmp/rapidex-variants.log || true
          cat /tmp/rapidex-variants-wsproxy.log || true
