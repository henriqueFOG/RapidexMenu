name: Apply AI safety policy

on:
  push:
    branches: [agent/commercial-hardening-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - name: Apply deterministic patch
        run: node scripts/patch-ai-safety-policy.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- lib/integrations/openai.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/integrations/openai.ts
          git commit -m "ai: enforce output leakage guard"
          git push origin HEAD:agent/commercial-hardening-p0
