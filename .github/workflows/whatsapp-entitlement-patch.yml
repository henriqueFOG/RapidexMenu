name: WhatsApp entitlement patch

on:
  push:
    branches: [agent/commercial-hardening-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - name: Stop paid automation after downgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/webhooks/whatsapp/route.ts')
          source = path.read_text()
          if 'import { hasCommercialFeature } from "@/lib/entitlements";' not in source:
            source = source.replace(
              'import { DEMO_RESTAURANT_ID, ensureDemoData } from "@/lib/demo-data";\n',
              'import { DEMO_RESTAURANT_ID, ensureDemoData } from "@/lib/demo-data";\nimport { hasCommercialFeature } from "@/lib/entitlements";\n',
            )
          old = '  if (conversation.status === "human") return;\n\n  const draft = await getWhatsAppDraft(db, restaurantId, customer.id, conversation.id);'
          new = '''  if (conversation.status === "human") return;

  const commercialState = await db.prepare(
    "SELECT plan, status, trial_ends_at FROM restaurants WHERE id = ? LIMIT 1",
  ).bind(restaurantId).first<{
    plan: "start" | "growth" | "scale";
    status: string;
    trial_ends_at: number | null;
  }>();
  const whatsappEntitled = Boolean(commercialState && hasCommercialFeature({
    plan: commercialState.plan,
    restaurantStatus: commercialState.status,
    trialEndsAt: commercialState.trial_ends_at,
  }, "whatsapp_connection"));
  if (!whatsappEntitled) {
    // Preserve inbound history and delivery/status events, but stop paid bot
    // automation immediately after entitlement loss. The owner can still
    // disconnect the integration from the control plane.
    await db.prepare("UPDATE conversations SET status = 'human', updated_at = ? WHERE id = ?")
      .bind(Date.now(), conversation.id)
      .run();
    return;
  }

  const draft = await getWhatsAppDraft(db, restaurantId, customer.id, conversation.id);'''
          if old not in source:
            raise SystemExit('Expected WhatsApp insertion point not found')
          source = source.replace(old, new)
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/webhooks/whatsapp/route.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "billing: stop WhatsApp bot after entitlement loss"
          git push origin HEAD:agent/commercial-hardening-p0
