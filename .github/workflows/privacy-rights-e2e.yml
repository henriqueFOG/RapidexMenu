name: RapidexMenu Privacy Rights E2E

on:
  push:
    branches: [agent/checklist-p0-wave-4-lgpd-acceptance]
  pull_request:
    branches: [hmg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidex
          POSTGRES_DB: rapidex_hmg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rapidex -d rapidex_hmg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      RAPIDEX_RUNTIME: vercel
      RAPIDEX_ENV: hmg
      RAPIDEX_PUBLIC_URL: http://localhost:3000
      RAPIDEX_AUTH_MODE: native
      RAPIDEX_SIGNUP_ENABLED: "true"
      RAPIDEX_SESSION_SECRET: hmg-ci-session-secret-32-characters-minimum-only
      DATABASE_URL: postgresql://rapidex@127.0.0.1:5432/rapidex_hmg?sslmode=disable
      RAPIDEX_POSTGRES_WS_PROXY: 127.0.0.1:9876
      RAPIDEX_E2E_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start database proxy
        run: |
          nohup node scripts/hmg-wsproxy.mjs >/tmp/privacy-wsproxy.log 2>&1 &
          for attempt in $(seq 1 20); do
            if grep -q "ws://127.0.0.1:9876" /tmp/privacy-wsproxy.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/privacy-wsproxy.log || true
          exit 1
      - name: Build and migrate
        run: npm run build:vercel
      - name: Start HMG runtime
        run: |
          nohup npx --no-install next start -H 127.0.0.1 -p 3000 >/tmp/privacy-runtime.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/privacy-runtime.log || true
          exit 1
      - name: Validate privacy rights
        run: node scripts/privacy-rights-e2e.mjs
      - name: Verify privacy requests persisted
        run: |
          for type in correction opt_out access portability deletion; do
            count="$(psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -Atc "SELECT count(*) FROM privacy_requests WHERE request_type = '$type'")"
            test "$count" -ge 1
          done
      - name: Logs on failure
        if: failure()
        run: |
          cat /tmp/privacy-runtime.log || true
          cat /tmp/privacy-wsproxy.log || true
