name: Lock refresh probe

on:
  push:
    branches: [agent/commercial-hardening-p0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Refresh patched framework lock
        run: |
          npm install next@16.3.0 eslint-config-next@16.3.0 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev || true
      - name: Verify production audit after refresh
        run: npm audit --omit=dev --audit-level=high --package-lock-only
      - name: Commit reproducible dependency refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: upgrade patched framework dependencies"
          git push origin HEAD:agent/commercial-hardening-p0
