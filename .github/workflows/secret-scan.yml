name: Secret scan

on:
  pull_request:
    branches: [hmg]
  push:
    branches: [hmg, agent/commercial-hardening-p1]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan tracked files for high-confidence secret patterns
        run: node scripts/scan-secrets.mjs
