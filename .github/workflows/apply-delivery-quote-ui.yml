name: Apply delivery quote UI

on:
  push:
    branches: [agent/commercial-hardening-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - name: Apply deterministic patch
        run: python3 scripts/patch-delivery-quote-ui.py
      - name: Commit patch
        run: |
          if git diff --quiet -- app/loja/[slug]/StoreClient.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/loja/[slug]/StoreClient.tsx
          git commit -m "delivery: quote zone before checkout confirmation"
          git push origin HEAD:agent/commercial-hardening-p0
