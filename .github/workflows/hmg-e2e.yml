name: RapidexMenu HMG E2E

on:
  push:
    branches: [hmg, agent/commercial-ready]
  pull_request:
    branches: [hmg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidex-hmg-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidex
          POSTGRES_PASSWORD: rapidex
          POSTGRES_DB: rapidex_hmg
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rapidex -d rapidex_hmg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      RAPIDEX_RUNTIME: vercel
      RAPIDEX_ENV: hmg
      RAPIDEX_PUBLIC_URL: http://127.0.0.1:3000
      RAPIDEX_AUTH_MODE: native
      RAPIDEX_SIGNUP_ENABLED: "true"
      RAPIDEX_SESSION_SECRET: hmg-ci-session-secret-32-characters-minimum-only
      RAPIDEX_INTEGRATION_SECRET: hmg-ci-integration-secret-32-characters-minimum
      DATABASE_URL: postgresql://rapidex:rapidex@127.0.0.1:5432/rapidex_hmg
      RAPIDEX_E2E_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and migrate isolated HMG database
        run: npm run build:vercel

      - name: Verify database environment marker
        env:
          PGPASSWORD: rapidex
        run: |
          marker="$(psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -tAc "SELECT environment FROM rapidex_environment_meta WHERE singleton = 1")"
          test "$marker" = "hmg"

      - name: Start HMG runtime
        run: |
          nohup npx --no-install next start -H 127.0.0.1 -p 3000 > /tmp/rapidex-hmg.log 2>&1 &
          echo $! > /tmp/rapidex-hmg.pid

      - name: Wait for health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/rapidex-health.json; then
              cat /tmp/rapidex-health.json
              exit 0
            fi
            sleep 1
          done
          echo "HMG runtime did not become healthy"
          cat /tmp/rapidex-hmg.log || true
          exit 1

      - name: Run commercial HMG E2E
        run: node scripts/hmg-e2e.mjs

      - name: Runtime log on failure
        if: failure()
        run: cat /tmp/rapidex-hmg.log || true
