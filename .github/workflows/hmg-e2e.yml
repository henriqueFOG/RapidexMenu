name: RapidexMenu HMG E2E

on:
  push:
    branches: [hmg, agent/commercial-ready, agent/commercial-hardening-p1, agent/checklist-p0-wave-1, agent/commercial-p0-variants-hmg]
  pull_request:
    branches: [hmg]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidex-hmg-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidex
          POSTGRES_DB: rapidex_hmg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rapidex -d rapidex_hmg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      RAPIDEX_RUNTIME: vercel
      RAPIDEX_ENV: hmg
      RAPIDEX_PUBLIC_URL: http://localhost:3000
      RAPIDEX_AUTH_MODE: native
      RAPIDEX_SIGNUP_ENABLED: "true"
      RAPIDEX_SESSION_SECRET: hmg-ci-session-secret-32-characters-minimum-only
      RAPIDEX_INTEGRATION_SECRET: hmg-ci-integration-secret-32-characters-minimum
      CRON_SECRET: hmg-ci-cron-secret-32-characters-minimum-only
      DATABASE_URL: postgresql://rapidex@127.0.0.1:5432/rapidex_hmg?sslmode=disable
      RAPIDEX_POSTGRES_WS_PROXY: 127.0.0.1:9876
      RAPIDEX_E2E_URL: http://localhost:3000
      RAPIDEX_PUBLIC_E2E_RUN_ID: isolated-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Start disposable HMG database proxy
        run: |
          nohup node scripts/hmg-wsproxy.mjs > /tmp/rapidex-hmg-wsproxy.log 2>&1 &
          echo $! > /tmp/rapidex-hmg-wsproxy.pid
          for attempt in $(seq 1 20); do
            if grep -q "ws://127.0.0.1:9876" /tmp/rapidex-hmg-wsproxy.log 2>/dev/null; then
              cat /tmp/rapidex-hmg-wsproxy.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rapidex-hmg-wsproxy.log || true
          exit 1

      - name: Build and migrate isolated HMG database
        run: npm run build:vercel

      - name: Verify database environment marker
        run: |
          marker="$(psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -tAc "SELECT environment FROM rapidex_environment WHERE id = 1")"
          test "$marker" = "hmg"

      - name: Start HMG runtime
        run: |
          nohup npx --no-install next start -H 127.0.0.1 -p 3000 > /tmp/rapidex-hmg.log 2>&1 &
          echo $! > /tmp/rapidex-hmg.pid

      - name: Wait for health
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health >/tmp/rapidex-health.json; then
              cat /tmp/rapidex-health.json
              exit 0
            fi
            sleep 1
          done
          echo "HMG runtime did not become healthy"
          cat /tmp/rapidex-hmg.log || true
          exit 1

      - name: Validate critical security headers
        run: node scripts/security-headers-e2e.mjs

      - name: Run API commercial HMG E2E
        run: node scripts/hmg-e2e.mjs

      - name: Validate stock-safe product variants on the real public catalog
        run: node scripts/variant-e2e.mjs

      - name: Validate scheduled orders, slot capacity and stock restoration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/scheduled-order-e2e.mjs')
          text = path.read_text()
          text = text.replace('weeklyHours: alwaysOpen,\n    fulfillment:', 'isOpen: true,\n    weeklyHours: alwaysOpen,\n    fulfillment:', 1)
          path.write_text(text)
          PY
          node scripts/scheduled-order-e2e.mjs

      - name: Validate concurrent order numbering
        run: node scripts/order-number-race-e2e.mjs

      - name: Validate durable queue retry and dead-letter
        run: |
          job_id="queue-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          idem="queue-e2e:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          now_ms="$(date +%s%3N)"
          payload='{"to":"queue-e2e@rapidex-hmg.test","subject":"Queue E2E","html":"<p>retry test</p>"}'
          psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -v ON_ERROR_STOP=1 \
            -c "INSERT INTO job_queue (id, restaurant_id, job_type, idempotency_key, payload_json, status, attempt_count, max_attempts, available_at, created_at, updated_at) VALUES ('$job_id', NULL, 'transactional_email', '$idem', '$payload', 'queued', 0, 2, $now_ms, $now_ms, $now_ms);"

          curl --fail --silent -H "Authorization: Bearer $CRON_SECRET" http://localhost:3000/api/internal/process-jobs >/tmp/queue-worker-1.json
          cat /tmp/queue-worker-1.json
          first="$(psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -tAc "SELECT status || ':' || attempt_count FROM job_queue WHERE id = '$job_id'")"
          test "$first" = "retry:1"

          psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -v ON_ERROR_STOP=1 \
            -c "UPDATE job_queue SET available_at = 0 WHERE id = '$job_id';"
          curl --fail --silent -H "Authorization: Bearer $CRON_SECRET" http://localhost:3000/api/internal/process-jobs >/tmp/queue-worker-2.json
          cat /tmp/queue-worker-2.json
          second="$(psql -h 127.0.0.1 -U rapidex -d rapidex_hmg -tAc "SELECT status || ':' || attempt_count FROM job_queue WHERE id = '$job_id'")"
          test "$second" = "dead:2"

      - name: Validate protected internal job endpoints
        run: node scripts/cron-auth-e2e.mjs

      - name: Run canonical Playwright full UI, tenant isolation and PWA HMG E2E
        run: npx playwright test tests/landing-functional-ui.spec.mjs tests/hmg-public-e2e.spec.mjs tests/hmg-tenant-isolation.spec.mjs tests/pwa-hmg.spec.mjs --reporter=line

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapidexmenu-hmg-playwright-evidence
          path: |
            playwright-artifacts/
            playwright-public-artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Runtime log on failure
        if: failure()
        run: |
          cat /tmp/rapidex-hmg.log || true
          cat /tmp/rapidex-hmg-wsproxy.log || true
