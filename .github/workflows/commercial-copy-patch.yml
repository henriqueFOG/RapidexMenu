name: Commercial copy patch

on:
  push:
    branches: [agent/commercial-hardening-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - name: Remove unsupported commercial promises
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/RapidexLanding.tsx')
          source = path.read_text()
          replacements = {
            'Para operações com mais volume, equipe e unidades.': 'Para operações com mais volume, equipe e controle operacional.',
            '"Até 3 unidades"': '"KDS de cozinha"',
            '"KDS e fila inteligente"': '"Controles avançados de operação"',
            'Cupons, promoções e muito mais': 'Entrega, retirada e consumo no local',
          }
          for old, new in replacements.items():
            source = source.replace(old, new)
          path.write_text(source)
          PY
          if git diff --quiet -- app/RapidexLanding.tsx; then
            echo "Commercial copy already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/RapidexLanding.tsx
          git commit -m "sales: align landing claims with shipped capabilities"
          git push origin HEAD:agent/commercial-hardening-p0
