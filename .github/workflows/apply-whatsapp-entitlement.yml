name: Apply WhatsApp entitlement

on:
  push:
    branches: [agent/commercial-hardening-p0]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p0
      - name: Apply deterministic patch
        run: node scripts/patch-whatsapp-entitlement.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- app/api/webhooks/whatsapp/route.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/webhooks/whatsapp/route.ts
          git commit -m "billing: stop WhatsApp bot after entitlement loss"
          git push origin HEAD:agent/commercial-hardening-p0
