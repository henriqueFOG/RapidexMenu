name: Platform Admin Console E2E

on:
  pull_request:
    branches: [hmg]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapidex
          POSTGRES_DB: rapidex_hmg
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rapidex -d rapidex_hmg"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      RAPIDEX_RUNTIME: vercel
      RAPIDEX_ENV: hmg
      RAPIDEX_PUBLIC_URL: http://localhost:3000
      RAPIDEX_AUTH_MODE: native
      RAPIDEX_SIGNUP_ENABLED: "true"
      RAPIDEX_SESSION_SECRET: hmg-platform-admin-session-secret-32-characters-minimum
      RAPIDEX_OWNER_EMAIL: henry.francisco31@hotmail.com
      RAPIDEX_PLATFORM_E2E_PASSWORD: RapidexCentralE2E123
      DATABASE_URL: postgresql://rapidex@127.0.0.1:5432/rapidex_hmg?sslmode=disable
      RAPIDEX_POSTGRES_WS_PROXY: 127.0.0.1:9876
      RAPIDEX_E2E_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Start database proxy
        run: |
          nohup node scripts/hmg-wsproxy.mjs >/tmp/platform-admin-wsproxy.log 2>&1 &
          for attempt in $(seq 1 20); do
            if grep -q "ws://127.0.0.1:9876" /tmp/platform-admin-wsproxy.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/platform-admin-wsproxy.log || true
          exit 1
      - name: Build and migrate
        run: npm run build:vercel
      - name: Seed canonical platform owner
        run: node --import tsx scripts/seed-platform-admin-e2e.ts
      - name: Start runtime
        run: |
          nohup npx --no-install next start -H 127.0.0.1 -p 3000 >/tmp/platform-admin-runtime.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/platform-admin-runtime.log || true
          exit 1
      - name: Validate platform admin console
        run: npx playwright test tests/platform-admin-console.spec.mjs --reporter=line
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapidexmenu-platform-admin-console-evidence
          path: |
            playwright-platform-admin-artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Runtime log on failure
        if: failure()
        run: cat /tmp/platform-admin-runtime.log || true
