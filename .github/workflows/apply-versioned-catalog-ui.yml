name: Apply versioned catalog UI

on:
  push:
    branches: [agent/commercial-hardening-p1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p1
      - name: Apply deterministic patch
        run: node scripts/patch-store-versioned-catalog.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- app/loja/[slug]/StoreClient.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/loja/[slug]/StoreClient.tsx
          git commit -m "performance: load versioned catalog separately from store state"
          git push origin HEAD:agent/commercial-hardening-p1
