name: Apply dunning enqueue recovery

on:
  push:
    branches: [agent/commercial-hardening-p1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/commercial-hardening-p1
      - run: node scripts/patch-dunning-enqueue-recovery.mjs
      - run: |
          if git diff --quiet -- lib/billing-dunning.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/billing-dunning.ts
          git commit -m "jobs: recover dunning when enqueue itself fails"
          git push origin HEAD:agent/commercial-hardening-p1
